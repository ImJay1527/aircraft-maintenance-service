# Lightweight in-memory H2 cluster (no database containers needed).
#
# Usage:
#   docker compose -f docker-compose.h2.yml up --build

services:
  aircraft-1:
    build: .
    restart: unless-stopped
    ports: ["8081:8081"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SPRING_PROFILES_ACTIVE: instance1
      INSTANCE_NAME: instance1
      PORT: 8081
      PEERS: http://aircraft-2:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

  aircraft-2:
    build: .
    restart: unless-stopped
    ports: ["8091:8081"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SPRING_PROFILES_ACTIVE: instance2
      INSTANCE_NAME: instance2
      PORT: 8081
      PEERS: http://aircraft-1:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
