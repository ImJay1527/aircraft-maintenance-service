# Aircraft & Maintenance Service - Multi-instance replication cluster
# 2 instances, each with its own independent PostgreSQL database.
#
# Usage:
#   docker compose up --build               # Start 2 instances with PostgreSQL databases
#   docker compose up -d                    # Start in background
#   docker compose ps                       # Check status and health
#   docker compose logs -f                  # View logs
#   docker compose down                     # Stop all containers
#   docker compose down -v                  # Stop and remove database volumes
#
# Ports:
#   aircraft-1: http://localhost:8081  (DB: localhost:5431)
#   aircraft-2: http://localhost:8091  (DB: localhost:5434)

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

x-postgres-db: &postgres-db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: aircraft
    POSTGRES_USER: aircraft
    POSTGRES_PASSWORD: ${DB_PASSWORD:-aircraft}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U aircraft -d aircraft"]
    interval: 2s
    timeout: 3s
    retries: 30

x-aircraft-instance: &aircraft-instance
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
    interval: 10s
    timeout: 3s
    start_period: 40s
    retries: 5

services:
  # ---------- Instance 1 ----------
  aircraft-1:
    <<: *aircraft-instance
    build: .
    depends_on:
      aircraft-db-1: { condition: service_healthy }
    ports: ["8081:8081"]
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: instance1,postgres
      INSTANCE_NAME: instance1
      PORT: 8081
      DB_URL: jdbc:postgresql://aircraft-db-1:5432/aircraft
      DB_USER: aircraft
      DB_PASSWORD: ${DB_PASSWORD:-aircraft}
      PEERS: http://aircraft-2:8081

  aircraft-db-1:
    <<: *postgres-db
    ports: ["5431:5432"]
    volumes: ["aircraft-db-1-data:/var/lib/postgresql/data"]

  # ---------- Instance 2 ----------
  aircraft-2:
    <<: *aircraft-instance
    build: .
    depends_on:
      aircraft-db-2: { condition: service_healthy }
    ports: ["8091:8081"]
    environment:
      <<: *common-env
      SPRING_PROFILES_ACTIVE: instance2,postgres
      INSTANCE_NAME: instance2
      PORT: 8081
      DB_URL: jdbc:postgresql://aircraft-db-2:5432/aircraft
      DB_USER: aircraft
      DB_PASSWORD: ${DB_PASSWORD:-aircraft}
      PEERS: http://aircraft-1:8081

  aircraft-db-2:
    <<: *postgres-db
    ports: ["5434:5432"]
    volumes: ["aircraft-db-2-data:/var/lib/postgresql/data"]

volumes:
  aircraft-db-1-data:
  aircraft-db-2-data:
