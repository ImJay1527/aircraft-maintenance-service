spring.application.name=aircraft-maintenance-service
server.port=${PORT:8081}

# ---------- Database ----------
# Default: in-memory H2 (one independent DB per replica). Use the "postgres" profile for a real DB.
spring.datasource.url=${DB_URL:jdbc:h2:mem:${aircraft.db.name:aircraft};NON_KEYWORDS=VALUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.open-in-view=false

# ---------- Security ----------
# MUST be the same value in all three services.
sidis.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
sidis.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Distribution ----------
# Other replicas of THIS service (comma-separated base URLs)
aircraft.instance-name=${INSTANCE_NAME:instance1}
aircraft.peers=${PEERS:}
aircraft.peer-timeout-ms=${PEER_TIMEOUT_MS:1500}

# ---------- Ops ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Messaging (RabbitMQ / AMQP) ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple

# Dedicated queue per replica (Publish/Subscribe pattern)
aisafe.rabbitmq.aircraft-queue=aircraft.events.${aircraft.instance-name:instance1}
aisafe.rabbitmq.listener.auto-startup=${AISAFE_RABBITMQ_LISTENER_AUTO_STARTUP:${RABBITMQ_LISTENER_AUTO_STARTUP:false}}

# Retry & Dead Letter Exchange policy (Slide 15)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Transactional Outbox interval
aisafe.outbox.interval-ms=1000

